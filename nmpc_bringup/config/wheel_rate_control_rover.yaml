# Publish all joint states -------------------------------------------------
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Wheel torque controllers -------------------------------------------------
back_left_wheel_plant:
  type: velocity_controllers/JointVelocityController
  joint: back_left_wheel_joint
  
front_left_wheel_plant:
  type: velocity_controllers/JointVelocityController
  joint: front_left_wheel_joint

back_right_wheel_plant:
  type: velocity_controllers/JointVelocityController
  joint: back_right_wheel_joint

front_right_wheel_plant:
  type: velocity_controllers/JointVelocityController
  joint: front_right_wheel_joint

# Wheel steering controllers -----------------------------------------------
back_left_steering_plant:
  type: velocity_controllers/JointPositionController
  joint: back_left_steering_joint
  pid: {p: 100.0, i: 10.0, d: 0.0}

front_left_steering_plant:
  type: velocity_controllers/JointPositionController
  joint: front_left_steering_joint
  pid: {p: 100.0, i: 10.0, d: 0.0}

back_right_steering_plant:
  type: velocity_controllers/JointPositionController
  joint: back_right_steering_joint
  pid: {p: 100.0, i: 10.0, d: 0.0}

front_right_steering_plant:
  type: velocity_controllers/JointPositionController
  joint: front_right_steering_joint
  pid: {p: 100.0, i: 10.0, d: 0.0}

# Contact angle joint
back_left_contact_plant:
  type: effort_controllers/JointEffortController
  joint: back_left_contact_joint

front_left_contact_plant:
  type: effort_controllers/JointEffortController
  joint: front_left_contact_joint

back_right_contact_plant:
  type: effort_controllers/JointEffortController
  joint: back_right_contact_joint

front_right_contact_plant:
  type: effort_controllers/JointEffortController
  joint: front_right_contact_joint